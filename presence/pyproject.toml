[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatapp-presence"
version = "0.1.0"
description = "Presence and typing tracking worker for chatapp"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.0.0",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
