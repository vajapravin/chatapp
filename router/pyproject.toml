[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatapp-router"
version = "0.1.0"
description = "Asynchronous message router and envelope broker for chatapp"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.0.0",
    "nats-py>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.3",
    "chatapp-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
