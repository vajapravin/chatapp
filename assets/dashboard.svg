  <!-- Post 1 (Slack Style with code block) -->
  <circle cx="335" cy="148" r="16" fill="#3B82F6"/>
  <text x="335" y="153" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">PV</text>
  <text x="363" y="145" fill="#F3F4F6" font-size="13" font-weight="bold">Pravin Vaja</text>
  <rect x="442" y="134" width="46" height="16" rx="4" fill="#1E293B"/>
  <text x="465" y="146" fill="#94A3B8" font-size="10" text-anchor="middle">OWNER</text>
  <text x="498" y="145" fill="#6B7280" font-size="11">12:42 PM</text>

  <text x="363" y="172" fill="#E2E8F0" font-size="13">Invite validation and token verification middleware is now live across all endpoints:</text>

  <!-- Code Block -->
  <rect x="363" y="186" width="500" height="118" rx="8" fill="#030712" stroke="#1E293B" stroke-width="1"/>
  <rect x="363" y="186" width="500" height="24" rx="8" fill="#111827"/>
  <text x="378" y="202" fill="#64748B" font-size="11" font-family="monospace">python — middleware.py</text>
  <text x="378" y="230" fill="#F43F5E" font-size="12" font-family="monospace">async def <tspan fill="#60A5FA">verify_invite_token</tspan><tspan fill="#F3F4F6">(token: str, db: AsyncSession):</tspan></text>
  <text x="395" y="250" fill="#F3F4F6" font-size="12" font-family="monospace">token_hash = hashlib.sha256(token.encode()).hexdigest()</text>
  <text x="395" y="270" fill="#F43F5E" font-size="12" font-family="monospace">invite = <tspan fill="#F3F4F6">await db.execute(select(Invite).where(Invite.hash == token_hash))</tspan></text>
  <text x="395" y="290" fill="#F43F5E" font-size="12" font-family="monospace">return <tspan fill="#34D399">invite.scalar_one_or_none()</tspan></text>

  <!-- Reactions -->
  <rect x="363" y="314" width="52" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="389" y="331" fill="#F1F5F9" font-size="12" text-anchor="middle">🚀 7</text>
  <rect x="423" y="314" width="52" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="449" y="331" fill="#F1F5F9" font-size="12" text-anchor="middle">👍 4</text>

