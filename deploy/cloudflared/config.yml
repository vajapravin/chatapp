# Cloudflare Tunnel Configuration for chatapp on vajapravin.me
# Run via token: cloudflared tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
# Or via tunnel ID:
# tunnel: <TUNNEL_UUID>
# credentials-file: /etc/cloudflared/creds.json

ingress:
  # Web Client
  - hostname: chat.vajapravin.me
    service: http://web:80
    originRequest:
      noTLSVerify: true

  # FastAPI REST Backend
  - hostname: api.vajapravin.me
    service: http://api:8000
    originRequest:
      noTLSVerify: true

  # MQTT over WebSockets
  - hostname: mqtt.vajapravin.me
    service: http://mosquitto:9001
    originRequest:
      noTLSVerify: true

  # Pre-existing MinIO S3 API on Synology NAS
  - hostname: s3.vajapravin.me
    service: http://host.docker.internal:9000
    originRequest:
      noTLSVerify: true

  # Catch-all rule
  - service: http_status:404
