# Eclipse Mosquitto Configuration with mosquitto-go-auth for chatapp

per_listener_settings false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Internal TCP listener
listener 1883 0.0.0.0
allow_anonymous false

# Browser WebSockets listener
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false

# Auth plugin configuration
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_check_prefix false

# HTTP Backend endpoints on FastAPI
auth_opt_http_host api
auth_opt_http_port 8001
auth_opt_http_getuser_uri /v1/auth/mqtt/user
auth_opt_http_aclcheck_uri /v1/auth/mqtt/acl
auth_opt_http_with_json true
