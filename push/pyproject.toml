[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatapp-push"
version = "0.1.0"
description = "Web Push notification worker for chatapp"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7.0",
    "pywebpush>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "chatapp-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
