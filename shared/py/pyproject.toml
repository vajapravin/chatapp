[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatapp-shared"
version = "0.1.0"
description = "Shared models, JWT utilities, and provider interfaces for chatapp"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyjwt[crypto]>=2.8.0",
    "aiosmtplib>=3.0.0",
    "ulid-py>=1.1.0",
    "cryptography>=42.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatapp_shared"]
